apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenant3-apiserver-hpa
  namespace: tenant-clusters
spec:
  scaleTargetRef:
    apiVersion: kamaji.clastix.io/v1alpha1
    kind: TenantControlPlane
    name: tenant3
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Min
