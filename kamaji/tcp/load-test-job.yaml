apiVersion: batch/v1
kind: Job
metadata:
  name: apiserver-load-test
  namespace: tenant-clusters
spec:
  parallelism: 15
  completions: 15
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: load-test
    spec:
      restartPolicy: Never
      containers:
        - name: load-generator
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Starting INTENSIVE API server load test..."
              echo "Target: tenant3 API server"
              echo "Pod: $HOSTNAME"
              
              # Get the service endpoint
              API_SERVER="tenant3.tenant-clusters.svc.cluster.local:6443"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              
              # Generate continuous HEAVY load for 10 minutes
              END_TIME=$(($(date +%s) + 600))
              
              while [ $(date +%s) -lt $END_TIME ]; do
                # Parallel background requests - controlled batches to avoid OOM
                for batch in {1..10}; do
                  for i in {1..10}; do
                    (
                      kubectl --server=https://${API_SERVER} \
                        --insecure-skip-tls-verify \
                        --token=$TOKEN \
                        get nodes --request-timeout=3s 2>/dev/null || true
                    ) &
                    
                    (
                      kubectl --server=https://${API_SERVER} \
                        --insecure-skip-tls-verify \
                        --token=$TOKEN \
                        get pods -A --request-timeout=3s 2>/dev/null || true
                    ) &
                    
                    (
                      kubectl --server=https://${API_SERVER} \
                        --insecure-skip-tls-verify \
                        --token=$TOKEN \
                        get services -A --request-timeout=3s 2>/dev/null || true
                    ) &
                  done
                  
                  # Wait for this batch to complete before starting next
                  wait
                done
                
                echo "[$HOSTNAME] Load test running... $(date) - 10 batches completed"
              done
              
              echo "[$HOSTNAME] Load test completed!"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
