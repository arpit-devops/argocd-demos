apiVersion: kamaji.clastix.io/v1alpha1
kind: TenantControlPlane
metadata:
  name: tenant3
  namespace: tenant-clusters
  labels:
    app: tenant3-control-plane
spec:
  controlPlane:
    deployment:
      replicas: 3
      extraArgs:
        apiServer:
          - --profiling=true
      resources:
        apiServer:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        controllerManager:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        scheduler:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
    service:
      serviceType: ClusterIP
      port: 6443
      additionalMetadata:
        labels:
          app: tenant3-control-plane
          monitoring: enabled

  kubernetes:
    version: v1.26.1

  networkProfile:
    serviceCIDR: 10.96.0.0/16
    podCIDR: 10.244.0.0/16
    dnsServiceIPs:
      - 10.96.0.10
