apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kamaji
  namespace: argocd
spec:
  project: kamaji
  source:
    repoURL: https://clastix.github.io/charts
    chart: kamaji
    targetRevision: 0.11.4   # latest stable chart (adjust if needed)
    helm:
      releaseName: kamaji
      values: |
        replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kamaji-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
